name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip if present
        run: |
          set -x
          if [ -f "POkerlab mejorado.zip" ]; then
            echo "Found POkerlab mejorado.zip"
            unzip -o "POkerlab mejorado.zip"
          elif [ -f "PokerLab actualizado.zip" ]; then
            echo "Found PokerLab actualizado.zip"
            unzip -o "PokerLab actualizado.zip"
          elif [ -f "PokerLab-android(1).zip" ]; then
            echo "Found PokerLab-android(1).zip"
            unzip -o "PokerLab-android(1).zip"
          elif [ -f "PokerLab-android.zip" ]; then
            echo "Found PokerLab-android.zip"
            unzip -o "PokerLab-android.zip"
          fi

          if [ -d PokerLab ]; then
            echo "Copying from PokerLab/ folder..."
            cp -r PokerLab/app . 2>/dev/null || true
            cp -n PokerLab/build.gradle.kts . 2>/dev/null || true
            cp -n PokerLab/settings.gradle.kts . 2>/dev/null || true
            cp -n PokerLab/gradle.properties . 2>/dev/null || true
            mkdir -p gradle/wrapper
            cp -n PokerLab/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/ 2>/dev/null || true
          fi

          if [ -d app/src/main/java ]; then
            echo "Sources already at expected location"
          fi

          echo "=== Current sources ==="
          ls -la app/src/main/java/com/pokerlab/ 2>/dev/null || echo "No sources folder yet"
          find . -name "*.kt" | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Add signing config for installable release
        run: |
          # Create a proper build.gradle.kts with signing so AGP signs with v2/v3
          cat > app/build.gradle.kts << 'EOF'
plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("org.jetbrains.kotlin.plugin.compose")
}

android {
    namespace = "com.pokerlab"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.pokerlab"
        minSdk = 26
        targetSdk = 35
        versionCode = 2
        versionName = "1.1"
    }

    signingConfigs {
        create("release") {
            storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        release {
            isMinifyEnabled = false
            signingConfig = signingConfigs.getByName("release")
        }
        debug {
            isMinifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose = true
    }
}

dependencies {
    val bom = platform("androidx.compose:compose-bom:2024.09.03")
    implementation(bom)
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.core:core-splashscreen:1.0.1")
    implementation("androidx.activity:activity-compose:1.9.2")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.foundation:foundation")
    implementation("androidx.compose.material3:material3")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
}
EOF
          echo "=== Patched build.gradle.kts ==="
          cat app/build.gradle.kts

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la ~/.android/

      - name: Build Release APK (signed)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PokerLab-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: warn
