name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip if present
        run: |
          set -x
          # Prefer the improved zip first
          if [ -f "POkerlab mejorado.zip" ]; then
            echo "Found POkerlab mejorado.zip"
            unzip -o "POkerlab mejorado.zip"
          elif [ -f "PokerLab actualizado.zip" ]; then
            echo "Found PokerLab actualizado.zip"
            unzip -o "PokerLab actualizado.zip"
          elif [ -f "PokerLab-android(1).zip" ]; then
            echo "Found PokerLab-android(1).zip"
            unzip -o "PokerLab-android(1).zip"
          elif [ -f "PokerLab-android.zip" ]; then
            echo "Found PokerLab-android.zip"
            unzip -o "PokerLab-android.zip"
          fi

          # Handle common folder structures after unzip
          if [ -d PokerLab ]; then
            echo "Copying from PokerLab/ folder..."
            cp -r PokerLab/app . 2>/dev/null || true
            cp -n PokerLab/build.gradle.kts . 2>/dev/null || true
            cp -n PokerLab/settings.gradle.kts . 2>/dev/null || true
            cp -n PokerLab/gradle.properties . 2>/dev/null || true
            mkdir -p gradle/wrapper
            cp -n PokerLab/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/ 2>/dev/null || true
          fi

          # Also try if files landed at root
          if [ -d app/src/main/java ]; then
            echo "Sources already at expected location"
          fi

          echo "=== Current sources ==="
          ls -la app/src/main/java/com/pokerlab/ 2>/dev/null || echo "No sources folder yet"
          find . -name "*.kt" | head -30
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Configure release to use debug signing (installable APK)
        run: |
          # Make release builds signable with the default debug keystore
          # so the resulting APK can be installed without a custom keystore.
          cat >> app/build.gradle.kts << 'EOF'

android {
    signingConfigs {
        create("release") {
            storeFile = file("${System.getProperty("user.home")}/.android/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }
    buildTypes {
        getByName("release") {
            signingConfig = signingConfigs.getByName("release")
            isMinifyEnabled = false
        }
    }
}
EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PokerLab-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: warn
