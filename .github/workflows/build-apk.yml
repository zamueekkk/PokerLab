name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip if present
        run: |
          if [ -f "PokerLab-android(1).zip" ]; then
            echo "Extracting PokerLab-android(1).zip..."
            unzip -o "PokerLab-android(1).zip"
            if [ -d PokerLab ]; then
              cp -rn PokerLab/* . || true
              # Overwrite sources with original from zip
              cp -r PokerLab/app/src/main/java/com/pokerlab/* app/src/main/java/com/pokerlab/ || true
            fi
          elif [ -f "PokerLab-android.zip" ]; then
            echo "Extracting PokerLab-android.zip..."
            unzip -o "PokerLab-android.zip"
            if [ -d PokerLab ]; then
              cp -rn PokerLab/* . || true
              cp -r PokerLab/app/src/main/java/com/pokerlab/* app/src/main/java/com/pokerlab/ || true
            fi
          fi
          echo "=== Sources after extract ==="
          ls -la app/src/main/java/com/pokerlab/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PokerLab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn
