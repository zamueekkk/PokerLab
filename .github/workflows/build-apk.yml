name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip if present
        run: |
          set -x
          if [ -f "PokerLab-android(1).zip" ]; then
            echo "Found PokerLab-android(1).zip"
            unzip -o "PokerLab-android(1).zip"
          elif [ -f "PokerLab-android.zip" ]; then
            echo "Found PokerLab-android.zip"
            unzip -o "PokerLab-android.zip"
          fi
          if [ -d PokerLab ]; then
            echo "Copying from PokerLab/ folder..."
            cp -r PokerLab/app .
            cp -n PokerLab/build.gradle.kts . || true
            cp -n PokerLab/settings.gradle.kts . || true
            cp -n PokerLab/gradle.properties . || true
            mkdir -p gradle/wrapper
            cp -n PokerLab/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/ || true
          fi
          echo "=== Current sources ==="
          ls -la app/src/main/java/com/pokerlab/ || echo "No sources folder"
          find . -name "*.kt" | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PokerLab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn
