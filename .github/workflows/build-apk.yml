name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip (prefer newest)
        run: |
          set -x
          ZIP=""
          for f in \
            "PokerLab-android-26-nov-16-14.zip" \
            "POkerlab mejorado.zip" \
            "PokerLab actualizado.zip" \
            "PokerLab-android(1).zip" \
            "PokerLab-android.zip"
          do
            if [ -f "$f" ]; then
              ZIP="$f"
              break
            fi
          done

          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            unzip -o "$ZIP"
          fi

          if [ -d PokerLab ]; then
            echo "Copying from PokerLab/ folder..."
            cp -r PokerLab/app . 2>/dev/null || true
            cp -f PokerLab/build.gradle.kts . 2>/dev/null || true
            cp -f PokerLab/settings.gradle.kts . 2>/dev/null || true
            cp -f PokerLab/gradle.properties . 2>/dev/null || true
            mkdir -p gradle/wrapper
            cp -f PokerLab/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/ 2>/dev/null || true
            cp -f PokerLab/.gitignore . 2>/dev/null || true
          fi

          echo "=== Sources ==="
          find app/src -name "*.kt" 2>/dev/null | head -30 || echo "No kt yet"

      - name: Apply release build config (performance)
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.pokerlab"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.pokerlab"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val bom = platform("androidx.compose:compose-bom:2024.09.03")
              implementation(bom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.core:core-splashscreen:1.0.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat > app/proguard-rules.pro << 'EOF'
          -keep class androidx.compose.** { *; }
          -keep class kotlin.** { *; }
          -keep class kotlinx.** { *; }
          -dontwarn androidx.compose.**
          -dontwarn kotlin.**
          -keep class com.pokerlab.** { *; }
          EOF

          echo "Release config applied"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Release APK (optimized, debug-signed)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PokerLab-release
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
